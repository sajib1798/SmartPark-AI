[project]
name = "smartpark-ai"
version = "1.0.0"
description = "AI-powered parking occupancy and vehicle detection system"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "streamlit>=1.38.0",
    "pillow>=10.0.0",
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "pandas>=2.2.0",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }